name: SELL2AI Production Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Vercel alias
        run: sleep 18

      - name: Verify production homepage
        shell: bash
        run: |
          set -euo pipefail
          URL="https://sell2ai.vercel.app"
          ok=0
          for i in {1..12}; do
            if body="$(curl -fsSL --max-time 20 "$URL" 2>/dev/null)" && grep -Fq "Your store is open to people." <<<"$body"; then
              echo "Homepage live."
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" -eq 1

      - name: Verify merchant dashboard
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsSL --max-time 20 https://sell2ai.vercel.app/dashboard.html)"
          grep -Fq "Merchant Console" <<<"$body"
          grep -Fq "AI Buyer Test" <<<"$body"
          grep -Fq "Fix Pack" <<<"$body"

      - name: Verify deep scanner v0.2
        shell: bash
        run: |
          set -euo pipefail
          URL="https://sell2ai.vercel.app/api/scan?url=https%3A%2F%2Fexample.com"
          body="$(curl -fsSL --max-time 40 "$URL")"
          grep -Fq '"mode":"live"' <<<"$body"
          grep -Fq '"version":"0.2"' <<<"$body"
          grep -Fq '"domain":"example.com"' <<<"$body"
          grep -Fq '"pages":' <<<"$body"
          echo "$body"

      - name: Verify AI Buyer Test API
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsSL --max-time 45 -X POST https://sell2ai.vercel.app/api/buyer-test             -H 'content-type: application/json'             --data '{"url":"https://example.com","query":"Find a product under $35"}')"
          grep -Fq '"ok":true' <<<"$body"
          grep -Fq '"mode":"heuristic_buyer_test"' <<<"$body"

      - name: Verify Fix Pack API
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsSL --max-time 45 -X POST https://sell2ai.vercel.app/api/fixes             -H 'content-type: application/json'             --data '{"url":"https://example.com"}')"
          grep -Fq '"ok":true' <<<"$body"
          grep -Fq '"product-schema.jsonld"' <<<"$body"
          grep -Fq '"sell2ai-fix-checklist.md"' <<<"$body"

      - name: Verify private network blocking
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/private.json -w '%{http_code}' --max-time 20             'https://sell2ai.vercel.app/api/scan?url=http%3A%2F%2F127.0.0.1')"
          test "$code" = "422"
          grep -Eiq 'Private network targets are blocked' /tmp/private.json

      - name: Verify billing is safely gated without secrets
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/billing.json -w '%{http_code}' --max-time 20             -X POST https://sell2ai.vercel.app/api/checkout             -H 'content-type: application/json'             --data '{"plan":"starter"}')"
          if [ "$code" = "200" ]; then
            grep -Fq '"url":' /tmp/billing.json
          else
            test "$code" = "503"
            grep -Eiq 'Billing is not activated|not activated yet' /tmp/billing.json
          fi


  benchmark:
    if: contains(github.event.head_commit.message, 'Run 20-store benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for production alias
        run: sleep 20

      - name: Scan 20 public ecommerce storefronts
        shell: bash
        run: |
          set -u
          sites=(
            "https://allbirds.com"
            "https://www.gymshark.com"
            "https://www.glossier.com"
            "https://colourpop.com"
            "https://www.snitch.co.in"
            "https://www.bombayshavingcompany.com"
            "https://www.sugarcosmetics.com"
            "https://plumgoodness.com"
            "https://www.dotandkey.com"
            "https://mamaearth.in"
            "https://beminimalist.co"
            "https://www.bewakoof.com"
            "https://www.thesouledstore.com"
            "https://bluetokaicoffee.com"
            "https://www.boat-lifestyle.com"
            "https://www.lenskart.com"
            "https://www.tentree.com"
            "https://www.rarebeauty.com"
            "https://kyliecosmetics.com"
            "https://deciem.com"
          )
          printf "site\tresult\tscore\tplatform\tproducts\n" | tee benchmark.tsv
          success=0
          for site in "${sites[@]}"; do
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$site")"
            body="$(curl -sSL --max-time 45 "https://sell2ai.vercel.app/api/scan?url=$encoded" || true)"
            if grep -Fq '"mode":"live"' <<<"$body"; then
              SITE="$site" BODY="$body" python3 - <<'PY' | tee -a benchmark.tsv
import json,os
site=os.environ["SITE"]
try:
    d=json.loads(os.environ["BODY"])
    print(f"{site}\tPASS\t{d.get('score','')}\t{d.get('platform','')}\t{(d.get('detected') or {}).get('products','')}")
except Exception:
    print(f"{site}\tPARSE_ERROR\t\t\t")
PY
              success=$((success+1))
            else
              printf "%s\tFAIL\t\t\t\n" "$site" | tee -a benchmark.tsv
            fi
            sleep 1
          done
          echo "Successful live scans: $success / ${#sites[@]}" | tee -a benchmark.tsv
          cat benchmark.tsv >> "$GITHUB_STEP_SUMMARY"
          test "$success" -ge 8

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: sell2ai-beta-benchmark
          path: benchmark.tsv
